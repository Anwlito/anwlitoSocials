
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anwlito Socials</title>

<style>
@font-face{
  font-family:"AnwFont";
  src:url("fuente.ttf");
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial,sans-serif;
}

#fondo{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  opacity:0;
  transition:1s;
}

#icono{
  position:absolute;
  right:0;
  bottom:0;
  height:90vh;
  max-width:100%;
  object-fit:contain;
  opacity:0;
  transition:1s;
  pointer-events:none;
}

.botones{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  flex-wrap:wrap;
  padding:20px;
  opacity:0;
  transition:1s;
}

.botones img{
  height:16vh;
  max-width:25vw;
  object-fit:contain;
  cursor:pointer;
  transition:0.2s;
}

.botones img:hover{
  transform:scale(1.1);
}

.videoBtn{
  font-size:70px;
  cursor:pointer;
  filter:drop-shadow(0 0 10px cyan);
  transition:0.2s;
}

.videoBtn:hover{
  transform:scale(1.2);
}

/* Imagen estática de ModsOpti */
.enterLink{
  position:absolute;
  top:20px;
  left:20px;
  z-index:5;
  display:block;
  width:clamp(90px,14vw,180px);
  cursor:pointer;
  transition:transform 0.2s;
}

.enterLink img{
  display:block;
  width:100%;
  height:auto;
}

.enterLink:hover{
  transform:scale(1.06);
}

#startScreen{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
  cursor:pointer;
}

#startScreen img{
  width:60%;
  max-width:400px;
}

.startText{
  color:red;
  font-family:"AnwFont",Arial,sans-serif;
  text-align:center;
  padding:10px;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:0.3;}
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%,rgba(0,255,200,0.15),transparent 60%),
    radial-gradient(circle at 70% 70%,rgba(255,0,150,0.10),transparent 60%);
  mix-blend-mode:screen;
  pointer-events:none;
  z-index:4;
}

@media (max-width:600px){
  .botones{
    gap:18px;
  }

  .botones img{
    height:12vh;
  }

  .videoBtn{
    font-size:48px;
  }

  .enterLink{
    top:12px;
    left:12px;
    width:100px;
  }
}
</style>
</head>

<body>

<div id="startScreen">
  <img src="start.png" alt="">
  <p class="startText">PRESIONA LA PANTALLA PARA EMPEZAR</p>
</div>

<audio id="bgm" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<img id="fondo" src="fondo.png" alt="">
<img id="icono" src="anwlitoicon.png" alt="">

<!-- Imagen estática que abre ModsOpti -->
<a class="enterLink"
   href="https://anwlito.github.io/ModsOpti/"
   aria-label="Entrar a ModsOpti">
  <img src="Enter.png" alt="ModsOpti">
</a>

<div class="botones">

  <div class="videoBtn" onclick="openPlaylist()">📺</div>

  <a href="https://anwlitoc.carrd.co/" target="_blank" rel="noopener">
    <img src="yt2.png" alt="YouTube">
  </a>

  <a href="https://www.tiktok.com/@eliot_friend_anwlito"
     target="_blank" rel="noopener">
    <img src="tiktok2.png" alt="TikTok">
  </a>

  <a href="https://x.com/SoyAnwlitoyt" target="_blank" rel="noopener">
    <img src="Twitter.png" alt="Twitter">
  </a>

  <a href="https://discord.gg/YBnPcpTxqF" target="_blank" rel="noopener">
    <img src="Discord.png" alt="Discord">
  </a>

</div>

<script>
document.getElementById("startScreen").onclick = () => {
  document.getElementById("startScreen").style.display = "none";

  document.getElementById("fondo").style.opacity = "1";
  document.getElementById("icono").style.opacity = "1";
  document.querySelector(".botones").style.opacity = "1";

  document.getElementById("bgm").play().catch(() => {});
};

function openPlaylist(){
  location.href =
    "https://youtube.com/playlist?list=PLBb0DKDUmZDg&si=EIDTzMlS_kKOpae6";
}
</script>

</body>
</html>
