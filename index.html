
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anwlito Socials</title>

<style>
@font-face{
  font-family:"AnwFont";
  src:url("fuente.ttf");
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial,sans-serif;
}

#fondo{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  opacity:0;
  transition:1s;
}

#icono{
  position:absolute;
  right:0;
  bottom:0;
  height:90vh;
  max-width:100%;
  object-fit:contain;
  opacity:0;
  transition:1s;
  pointer-events:none;
}

.botones{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  flex-wrap:wrap;
  padding:20px;
  opacity:0;
  transition:1s;
}

.botones img{
  height:16vh;
  max-width:25vw;
  object-fit:contain;
  cursor:pointer;
  transition:0.2s;
}

.botones img:hover{
  transform:scale(1.1);
}

.videoBtn{
  font-size:70px;
  cursor:pointer;
  filter:drop-shadow(0 0 10px cyan);
  transition:0.2s;
}

.videoBtn:hover{
  transform:scale(1.2);
}

/* Botón de ModsOpti */
#modOptiButton{
  position:fixed;
  top:15px;
  right:15px;
  z-index:20;
  width:clamp(48px,7vw,80px);
  aspect-ratio:1;
  cursor:pointer;
  background:transparent;
  border:0;
  padding:0;
  display:grid;
  place-items:center;
}

#modOptiButton canvas{
  display:block;
  width:100%;
  height:100%;
}

#modOptiButton:focus-visible{
  outline:2px solid cyan;
  outline-offset:4px;
}

#startScreen{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
  cursor:pointer;
}

#startScreen img{
  width:60%;
  max-width:400px;
}

.startText{
  color:red;
  font-family:"AnwFont",Arial,sans-serif;
  text-align:center;
  padding:10px;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:0.3;}
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%,rgba(0,255,200,0.15),transparent 60%),
    radial-gradient(circle at 70% 70%,rgba(255,0,150,0.10),transparent 60%);
  mix-blend-mode:screen;
  pointer-events:none;
  z-index:4;
}

@media(max-width:600px){
  .botones{
    gap:18px;
  }

  .botones img{
    height:12vh;
  }

  .videoBtn{
    font-size:48px;
  }
}
</style>
</head>

<body>

<div id="startScreen">
  <img src="start.png" alt="">
  <p class="startText">PRESIONA LA PANTALLA PARA EMPEZAR</p>
</div>

<audio id="bgm" src="Music.mp3" loop></audio>

<img id="fondo" src="fondo.png" alt="">
<img id="icono" src="anwlitoicon.png" alt="">

<button id="modOptiButton" type="button"
        aria-label="Abrir ModsOpti">
  <canvas id="checkboxCanvas"></canvas>
</button>

<div class="botones">

  <div class="videoBtn" onclick="openPlaylist()">📺</div>

  <a href="https://anwlitoc.carrd.co/" target="_blank" rel="noopener">
    <img src="yt2.png" alt="YouTube">
  </a>

  <a href="https://www.tiktok.com/@eliot_friend_anwlito"
     target="_blank" rel="noopener">
    <img src="tiktok2.png" alt="TikTok">
  </a>

  <a href="https://x.com/SoyAnwlitoyt" target="_blank" rel="noopener">
    <img src="Twitter.png" alt="Twitter">
  </a>

  <a href="https://discord.gg/YBnPcpTxqF"
     target="_blank" rel="noopener">
    <img src="Discord.png" alt="Discord">
  </a>

</div>

<script>
/* Pantalla inicial */
document.getElementById("startScreen").onclick = () => {
  document.getElementById("startScreen").style.display = "none";

  document.getElementById("fondo").style.opacity = "1";
  document.getElementById("icono").style.opacity = "1";
  document.querySelector(".botones").style.opacity = "1";

  document.getElementById("bgm").play().catch(() => {});
};

/* Playlist */
function openPlaylist(){
  location.href =
    "https://youtube.com/playlist?list=PLBb0DKDUmZDg&si=EIDTzMlS_kKOpae6";
}

/* Animación del botón usando el XML */
(() => {
  const canvas = document.getElementById("checkboxCanvas");
  const ctx = canvas.getContext("2d");
  const button = document.getElementById("modOptiButton");

  const image = new Image();
  image.src = "checkboxThingie.png";

  const STATIC_ANIM = "Check Box Selected Static";
  const SELECT_ANIM = "Check Box selecting animation";
  const MODSOPTI_URL = "https://anwlito.github.io/ModsOpti/";

  let frames = {};
  let staticFrames = [];
  let selectFrames = [];
  let currentFrames = [];
  let frameIndex = 0;
  let playing = false;
  let lastTime = 0;
  let redirectTimer = null;
  const frameDuration = 1000 / 24;

  function getAnimationFrames(prefix){
    return Object.keys(frames)
      .filter(name => name === prefix || name.startsWith(prefix))
      .sort((a,b) => {
        const number = name => {
          const match = name.match(/(\d+)(?!.*\d)/);
          return match ? Number(match[1]) : 0;
        };
        return number(a) - number(b);
      })
      .map(name => frames[name]);
  }

  function drawFrame(){
    if(!image.complete || !image.naturalWidth ||
       !currentFrames.length) return;

    const frame = currentFrames[
      Math.min(frameIndex,currentFrames.length - 1)
    ];

    if(!frame) return;

    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    if(!rect.width || !rect.height) return;

    const widthPx = Math.round(rect.width * dpr);
    const heightPx = Math.round(rect.height * dpr);

    if(canvas.width !== widthPx || canvas.height !== heightPx){
      canvas.width = widthPx;
      canvas.height = heightPx;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const scale = Math.min(
      canvas.width / frame.width,
      canvas.height / frame.height
    );

    const drawWidth = frame.width * scale;
    const drawHeight = frame.height * scale;
    const x = (canvas.width - drawWidth) / 2;
    const y = (canvas.height - drawHeight) / 2;

    ctx.drawImage(
      image,
      frame.x,frame.y,frame.width,frame.height,
      x,y,drawWidth,drawHeight
    );
  }

  function showStatic(){
    currentFrames = staticFrames;
    frameIndex = 0;
    playing = false;
    drawFrame();
  }

  function animate(time){
    if(playing && currentFrames.length){
      if(!lastTime) lastTime = time;

      if(time - lastTime >= frameDuration){
        const steps = Math.floor((time - lastTime) / frameDuration);
        lastTime += steps * frameDuration;
        frameIndex += steps;

        if(frameIndex >= currentFrames.length){
          frameIndex = currentFrames.length - 1;
          playing = false;
        }

        drawFrame();

        if(!playing && redirectTimer === null){
          redirectTimer = setTimeout(() => {
            location.href = MODSOPTI_URL;
          },100);
        }
      }
    }

    requestAnimationFrame(animate);
  }

  function loadXML(){
    fetch("checkboxThingie.xml")
      .then(response => {
        if(!response.ok) throw new Error("No se pudo cargar el XML");
        return response.text();
      })
      .then(text => {
        const xml = new DOMParser().parseFromString(
          text,"application/xml"
        );

        if(xml.querySelector("parsererror")){
          throw new Error("El XML no es válido");
        }

        xml.querySelectorAll("SubTexture").forEach(node => {
          const name = node.getAttribute("name") || "";

          frames[name] = {
            x:Number(node.getAttribute("x")),
            y:Number(node.getAttribute("y")),
            width:Number(node.getAttribute("width")),
            height:Number(node.getAttribute("height"))
          };
        });

        staticFrames = getAnimationFrames(STATIC_ANIM);
        selectFrames = getAnimationFrames(SELECT_ANIM);

        if(!staticFrames.length){
          console.error("No se encontró:",STATIC_ANIM);
          return;
        }

        image.onload = () => {
          showStatic();
          requestAnimationFrame(animate);
        };

        if(image.complete && image.naturalWidth){
          showStatic();
          requestAnimationFrame(animate);
        }
      })
      .catch(error => console.error("Checkbox:",error));
  }

  button.addEventListener("click",() => {
    if(playing || redirectTimer !== null) return;

    /* Si no hay animación de selección, abre ModsOpti igualmente */
    if(!selectFrames.length){
      location.href = MODSOPTI_URL;
      return;
    }

    currentFrames = selectFrames;
    frameIndex = 0;
    lastTime = 0;
    playing = true;
    drawFrame();

    const sound = new Audio("Enter.mp3");
    sound.play().catch(() => {});
  });

  image.onerror = () => {
    console.error("No se pudo cargar checkboxThingie.png");
  };

  loadXML();
})();
</script>

</body>
</html>
