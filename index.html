
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anwlito Socials</title>

<style>
@font-face{
  font-family:"AnwFont";
  src:url("fuente.ttf");
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:black;
  font-family:Arial,sans-serif;
}

#fondo{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  opacity:0;
  transition:1s;
}

#icono{
  position:absolute;
  right:0;
  bottom:0;
  height:90vh;
  max-width:100%;
  object-fit:contain;
  opacity:0;
  transition:1s;
  pointer-events:none;
}

.botones{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  flex-wrap:wrap;
  padding:20px;
  opacity:0;
  transition:1s;
}

.botones img{
  height:16vh;
  max-width:25vw;
  object-fit:contain;
  cursor:pointer;
  transition:0.2s;
}

.botones img:hover{
  transform:scale(1.1);
}

.videoBtn{
  font-size:70px;
  cursor:pointer;
  filter:drop-shadow(0 0 10px cyan);
  transition:0.2s;
}

.videoBtn:hover{
  transform:scale(1.2);
}

/* Botón animado de ModsOpti */
#modOptiButton{
  position:fixed;
  top:15px;
  right:15px;
  z-index:20;
  width:clamp(48px,7vw,80px);
  aspect-ratio:1;
  cursor:pointer;
  background:transparent;
  border:0;
  padding:0;
  display:grid;
  place-items:center;
}

#modOptiButton canvas{
  width:100%;
  height:100%;
  image-rendering:auto;
}

#modOptiButton:focus-visible{
  outline:2px solid cyan;
  outline-offset:4px;
}

#startScreen{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:10;
  cursor:pointer;
}

#startScreen img{
  width:60%;
  max-width:400px;
}

.startText{
  color:red;
  font-family:"AnwFont",Arial,sans-serif;
  text-align:center;
  padding:10px;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:0.3;}
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%,rgba(0,255,200,0.15),transparent 60%),
    radial-gradient(circle at 70% 70%,rgba(255,0,150,0.10),transparent 60%);
  mix-blend-mode:screen;
  pointer-events:none;
  z-index:4;
}

@media (max-width:600px){
  .botones{gap:18px;}
  .botones img{height:12vh;}
  .videoBtn{font-size:48px;}
}
</style>
</head>

<body>

<div id="startScreen">
  <img src="start.png" alt="">
  <p class="startText">PRESIONA LA PANTALLA PARA EMPEZAR</p>
</div>

<audio id="bgm" src="music.mp3" loop></audio>

<img id="fondo" src="fondo.png" alt="">
<img id="icono" src="anwlitoicon.png" alt="">

<button id="modOptiButton"
        type="button"
        aria-label="Entrar a ModsOpti">
  <canvas id="checkboxCanvas"></canvas>
</button>

<div class="botones">
  <div class="videoBtn" onclick="openPlaylist()">📺</div>

  <a href="https://anwlitoc.carrd.co/" target="_blank" rel="noopener">
    <img src="yt2.png" alt="YouTube">
  </a>

  <a href="https://www.tiktok.com/@eliot_friend_anwlito"
     target="_blank" rel="noopener">
    <img src="tiktok2.png" alt="TikTok">
  </a>

  <a href="https://x.com/SoyAnwlitoyt" target="_blank" rel="noopener">
    <img src="Twitter.png" alt="Twitter">
  </a>

  <a href="https://discord.gg/YBnPcpTxqF"
     target="_blank" rel="noopener">
    <img src="Discord.png" alt="Discord">
  </a>
</div>

<script>
document.getElementById("startScreen").onclick = () => {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("fondo").style.opacity = "1";
  document.getElementById("icono").style.opacity = "1";
  document.querySelector(".botones").style.opacity = "1";
  document.getElementById("bgm").play().catch(() => {});
};

function openPlaylist(){
  location.href =
    "https://youtube.com/playlist?list=PLBb0DKDUmZDg&si=EIDTzMlS_kKOpae6";
}

/* Animación del botón desde el XML */
(() => {
  const image = new Image();
  image.src = "checkboxThingie.png";

  const canvas = document.getElementById("checkboxCanvas");
  const ctx = canvas.getContext("2d");
  const button = document.getElementById("modOptiButton");

  const xmlPath = "checkboxThingie.xml";
  const staticName = "Check Box Selected Static";
  const selectName = "Check Box selecting animation";

  let frames = {};
  let currentFrames = [];
  let frameIndex = 0;
  let lastTime = 0;
  let playing = false;
  let redirectTimer = null;
  let frameDuration = 1000 / 24;

  function getFrameName(name){
    return name.replace(/\.png$/i, "");
  }

  function findAnimation(prefix){
    return Object.keys(frames)
      .filter(name => name === prefix ||
        name.startsWith(prefix))
      .sort((a,b) => {
        const getNumber = name => {
          const match = name.match(/(\d+)(?!.*\d)/);
          return match ? Number(match[1]) : 0;
        };
        return getNumber(a) - getNumber(b);
      })
      .map(name => frames[name]);
  }

  function drawFrame(){
    if(!image.complete || !image.naturalWidth ||
       !currentFrames.length) return;

    const frame = currentFrames[
      Math.min(frameIndex, currentFrames.length - 1)
    ];

    if(!frame) return;

    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();

    if(!rect.width || !rect.height) return;

    const targetWidth = Math.round(rect.width * dpr);
    const targetHeight = Math.round(rect.height * dpr);

    if(canvas.width !== targetWidth ||
       canvas.height !== targetHeight){
      canvas.width = targetWidth;
      canvas.height = targetHeight;
    }

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const scale = Math.min(
      canvas.width / frame.width,
      canvas.height / frame.height
    );

    const width = frame.width * scale;
    const height = frame.height * scale;
    const x = (canvas.width - width) / 2;
    const y = (canvas.height - height) / 2;

    ctx.drawImage(
      image,
      frame.x, frame.y, frame.width, frame.height,
      x, y, width, height
    );
  }

  function playStatic(){
    currentFrames = findAnimation(staticName);

    if(!currentFrames.length){
      console.error("No se encontró la animación:", staticName);
      return;
    }

    frameIndex = 0;
    playing = false;
    drawFrame();
  }

  function animate(time){
    if(playing && currentFrames.length){
      if(!lastTime) lastTime = time;

      if(time - lastTime >= frameDuration){
        const steps = Math.floor((time - lastTime) / frameDuration);
        lastTime += steps * frameDuration;
        frameIndex += steps;

        if(frameIndex >= currentFrames.length){
          frameIndex = currentFrames.length - 1;
          playing = false;
        }

        drawFrame();
      }
    }

    requestAnimationFrame(animate);
  }

  fetch(xmlPath)
    .then(response => {
      if(!response.ok) throw new Error("No se pudo cargar el XML");
      return response.text();
    })
    .then(xmlText => {
      const xml = new DOMParser().parseFromString(
        xmlText, "application/xml"
      );

      if(xml.querySelector("parsererror")){
        throw new Error("El XML no es válido");
      }

      xml.querySelectorAll("SubTexture").forEach(node => {
        const name = getFrameName(node.getAttribute("name") || "");

        frames[name] = {
          x: Number(node.getAttribute("x")),
          y: Number(node.getAttribute("y")),
          width: Number(node.getAttribute("width")),
          height: Number(node.getAttribute("height"))
        };
      });

      image.onload = () => {
        playStatic();
        requestAnimationFrame(animate);
      };

      if(image.complete && image.naturalWidth){
        playStatic();
        requestAnimationFrame(animate);
      }
    })
    .catch(error => console.error(error));

  button.addEventListener("click", () => {
    if(playing || redirectTimer) return;

    const selectionFrames = findAnimation(selectName);

    if(!selectionFrames.length){
      location.href = "https://anwlito.github.io/anwlitoSocials/";
      return;
    }

    currentFrames = selectionFrames;
    frameIndex = 0;
    lastTime = 0;
    playing = true;

    drawFrame();

    const audio = new Audio("BackSound.mp3");
    audio.play().catch(() => {});

    redirectTimer = setTimeout(() => {
      location.href = "https://anwlito.github.io/anwlitoSocials/";
    }, currentFrames.length * frameDuration + 100);
  });
})();
</script>

</body>
</html>
